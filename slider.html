<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiper 11 Coverflow Tailwind</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Swiper 11 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    .swiper {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 50px;
    }

    .swiper-slide {
      width: 300px;
      height: 400px;
      background-position: center;
      background-size: cover;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="bg-gray-100">

  <div class="max-w-6xl mx-auto py-16 text-center">
    <h2 class="text-3xl font-semibold mb-10">Swiper 11 Coverflow Tailwind</h2>

    <!-- Slider main container -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('OIP.webp')">
          Slide 1
        </div>

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('CBDM-1ST-ISSUE-COVER-01.jpg')">
          Slide 2
        </div>

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('bcmea-Ceramic-Bangladesh-Magazine-4th-issue.jpg')">
          Slide 3
        </div>

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('CBDM-1ST-ISSUE-COVER-01.jpg')">
          Slide 4
        </div>

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('OIP.webp')">
          Slide 5
        </div>

        <div class="swiper-slide flex items-end justify-center text-white text-xl font-semibold"
          style="background-image:url('bcmea-Ceramic-Bangladesh-Magazine-4th-issue.jpg')">
          Slide 6
        </div>

      </div>

      <!-- Pagination -->
      <div class="swiper-pagination"></div>

      <!-- Navigation -->
      <div class="swiper-button-next text-blue-500"></div>
      <div class="swiper-button-prev text-blue-500"></div>
    </div>
  </div>

  <!-- Swiper 11 JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: false,
      slidesPerView: 3,
      loop: true,
      coverflowEffect: {
        rotate: -33,
        stretch: 32,
        depth: 100,
        modifier: 1,
        slideShadows: false,
      },

      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },

      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>

</body>

</html>
